<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1E1528"/>
      <stop offset="100%" stop-color="#0D0B14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="url(#bg)"/>

  <!-- Corner accents -->
  <line x1="0" y1="0" x2="16" y2="0"  stroke="#B8860B" stroke-width="1.2" opacity="0.7"/>
  <line x1="0" y1="0" x2="0"  y2="16" stroke="#B8860B" stroke-width="1.2" opacity="0.7"/>
  <line x1="64" y1="64" x2="48" y2="64" stroke="#B8860B" stroke-width="1.2" opacity="0.7"/>
  <line x1="64" y1="64" x2="64" y2="48" stroke="#B8860B" stroke-width="1.2" opacity="0.7"/>

  <!-- MS text -->
  <text
    x="32" y="41"
    text-anchor="middle"
    font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="26"
    letter-spacing="3"
    fill="url(#gold)"
  >MS</text>
</svg>
