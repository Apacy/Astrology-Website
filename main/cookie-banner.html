<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Предпросмотр — Cookie Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --rose:        #f4c2c2;
    --light-rose:  #fff5f7;
    --deep-gold:   #412402;
    --midnight:    #2e1a28;
    --highlight:   #ffffffcc;
    --bg-gradient: linear-gradient(to right top, #eec6d3, #ffe5bf);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Demo body ── */
  body {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .demo-label {
    position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
    font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(65,36,2,0.35); white-space: nowrap;
  }
  .demo-bg {
    font-size: 0.7rem; letter-spacing: 0.1em;
    color: rgba(65,36,2,0.2);
  }

  /* ══════════════════════════════════════
     COOKIE BANNER
     Вставьте <style>, <div> и <script> на каждую страницу
     ══════════════════════════════════════ */

  #cookie-banner {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(140px);
    width: calc(100% - 3rem);
    max-width: 700px;
    background: var(--highlight);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(244,194,194,0.6);
    border-radius: 20px;
    padding: 1.4rem 1.8rem;
    box-shadow:
      0 8px 32px rgba(65,36,2,0.1),
      0 2px 8px rgba(238,198,211,0.4),
      inset 0 1px 0 rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    gap: 1.5rem;
    z-index: 9999;
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.22,1,0.36,1), opacity 0.5s ease;
  }
  #cookie-banner.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  #cookie-banner::before {
    content: '';
    position: absolute;
    top: 0; left: 12%; right: 12%; height: 1px;
    background: linear-gradient(to right, transparent, rgba(244,194,194,0.9), transparent);
  }

  .cookie-icon { font-size: 1.7rem; flex-shrink: 0; }

  .cookie-text {
    flex: 1;
    font-size: 0.75rem;
    font-weight: 300;
    color: rgba(46,26,40,0.7);
    line-height: 1.7;
  }
  .cookie-text strong {
    display: block;
    font-weight: 400;
    color: var(--midnight);
    margin-bottom: 0.25rem;
    font-size: 0.8rem;
  }
  .cookie-text a {
    color: var(--deep-gold);
    text-decoration-color: rgba(65,36,2,0.3);
    text-underline-offset: 2px;
    transition: color 0.2s, text-decoration-color 0.2s;
  }
  .cookie-text a:hover { color: #6b3d04; text-decoration-color: #6b3d04; }

  .cookie-actions { display: flex; flex-direction: column; gap: 0.5rem; flex-shrink: 0; }

  .btn-accept {
    background: linear-gradient(135deg, #c8845a, var(--deep-gold));
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 0.55rem 1.5rem;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.68rem; font-weight: 400;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(65,36,2,0.25);
    transition: opacity 0.2s, box-shadow 0.2s;
    white-space: nowrap;
  }
  .btn-accept:hover { opacity: 0.88; box-shadow: 0 6px 20px rgba(65,36,2,0.32); }

  .btn-decline {
    background: transparent;
    color: rgba(46,26,40,0.45);
    border: 1px solid rgba(244,194,194,0.7);
    border-radius: 20px;
    padding: 0.5rem 1.5rem;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.68rem; font-weight: 300;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .btn-decline:hover { border-color: var(--rose); color: rgba(46,26,40,0.7); }

  @media (max-width: 560px) {
    #cookie-banner { flex-direction: column; align-items: flex-start; gap: 1rem; padding: 1.2rem 1.3rem; }
    .cookie-actions { flex-direction: row; width: 100%; }
    .btn-accept, .btn-decline { flex: 1; text-align: center; }
  }
</style>
</head>
<body>

<span class="demo-label">Предпросмотр баннера</span>
<p class="demo-bg">Ваш сайт здесь...</p>

<!-- ══ COOKIE BANNER HTML ══ -->
<div id="cookie-banner" role="dialog" aria-label="Согласие на использование файлов cookie">
  <span class="cookie-icon">🍃</span>
  <div class="cookie-text">
    <strong>Мы используем файлы cookie</strong>
    Этот сайт использует cookie и пиксели отслеживания (Meta Pixel) для аналитики и улучшения работы сайта. Нажимая «Принять», вы соглашаетесь с нашей
    <a href="privacy-policy.html">Политикой конфиденциальности</a>.
  </div>
  <div class="cookie-actions">
    <button class="btn-accept" onclick="acceptCookies()">Принять</button>
    <button class="btn-decline" onclick="declineCookies()">Отклонить</button>
  </div>
</div>

<!-- ══ COOKIE SCRIPT ══ -->
<script>
  (function() {
    if (!localStorage.getItem('cookie_consent')) {
      setTimeout(function() {
        var b = document.getElementById('cookie-banner');
        if (b) b.classList.add('visible');
      }, 800);
    } else if (localStorage.getItem('cookie_consent') === 'accepted') {
      loadMetaPixel();
    }
  })();

  function acceptCookies() {
    localStorage.setItem('cookie_consent', 'accepted');
    hideBanner(); loadMetaPixel();
  }
  function declineCookies() {
    localStorage.setItem('cookie_consent', 'declined');
    hideBanner();
  }
  function hideBanner() {
    var b = document.getElementById('cookie-banner');
    if (b) {
      b.style.opacity = '0';
      b.style.transform = 'translateX(-50%) translateY(140px)';
      setTimeout(function() { b.style.display = 'none'; }, 500);
    }
  }
  function loadMetaPixel() {
    if (window._metaPixelLoaded) return;
    window._metaPixelLoaded = true;
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window,document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '2227666094419935');
    fbq('track', 'PageView');
  }
</script>

</body>
</html>
