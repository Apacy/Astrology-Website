<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Спасибо — Marina Smit</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:      #412402;
    --gold-mid:  #7a5a3a;
    --rose:      #c8a090;
    --bg:        #1e1210;
    --bg-card:   #2a1a14;
    --text:      #f5ede8;
    --text-dim:  rgba(245,237,232,0.55);
    --border:    rgba(200,160,144,0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    position: relative;
    overflow: hidden;
  }

  /* Subtle background texture circles */
  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    border: 1px solid rgba(200,160,144,0.06);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 450px; height: 450px;
    border-radius: 50%;
    border: 1px solid rgba(200,160,144,0.05);
    pointer-events: none;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 4rem 3.5rem;
    max-width: 560px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    animation: cardIn 0.7s ease forwards;
    opacity: 0;
    transform: translateY(24px);
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Top ornament line */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--rose), transparent);
    border-radius: 1px;
  }

  .eyebrow {
    font-size: 0.62rem;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--rose);
    margin-bottom: 1.8rem;
    display: block;
    animation: fadeIn 0.6s 0.3s ease forwards;
    opacity: 0;
  }

  /* SVG symbol */
  .symbol {
    width: 64px;
    height: 64px;
    margin: 0 auto 2rem;
    opacity: 0;
    animation: fadeIn 0.6s 0.4s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-weight: 300;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 0.4rem;
    opacity: 0;
    animation: fadeIn 0.6s 0.5s ease forwards;
  }
  h1 em {
    font-style: italic;
    color: var(--rose);
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    font-style: italic;
    font-weight: 300;
    color: var(--text-dim);
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeIn 0.6s 0.6s ease forwards;
  }

  .rule {
    width: 48px;
    height: 1px;
    background: var(--rose);
    margin: 0 auto 2rem;
    border: none;
    opacity: 0;
    animation: fadeIn 0.6s 0.65s ease forwards;
  }

  .message {
    font-size: 0.9rem;
    font-weight: 300;
    color: var(--text-dim);
    line-height: 1.85;
    max-width: 400px;
    margin: 0 auto 2.5rem;
    opacity: 0;
    animation: fadeIn 0.6s 0.7s ease forwards;
  }

  /* Countdown */
  .countdown-wrap {
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeIn 0.6s 0.85s ease forwards;
  }
  .countdown-label {
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
    display: block;
  }
  .countdown-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 300;
    color: var(--rose);
    line-height: 1;
  }

  /* Progress ring */
  .progress-ring {
    position: relative;
    width: 72px;
    height: 72px;
    margin: 0 auto 0.6rem;
  }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring circle.track {
    fill: none;
    stroke: var(--border);
    stroke-width: 2;
  }
  .progress-ring circle.fill {
    fill: none;
    stroke: var(--rose);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 188.5;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
  }
  .progress-ring .num-inside {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--rose);
  }

  .btn {
    display: inline-block;
    background: transparent;
    border: 1px solid var(--rose);
    color: var(--text);
    padding: 0.85rem 2.2rem;
    border-radius: 20px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.25s, color 0.25s, border-color 0.25s;
    opacity: 0;
    animation: fadeIn 0.6s 0.9s ease forwards;
  }
  .btn:hover {
    background: var(--rose);
    color: var(--bg);
    border-color: var(--rose);
  }

  .footer-note {
    margin-top: 3rem;
    font-size: 0.65rem;
    font-weight: 300;
    color: rgba(245,237,232,0.25);
    letter-spacing: 0.08em;
    opacity: 0;
    animation: fadeIn 0.6s 1s ease forwards;
  }

  @media (max-width: 480px) {
    .card { padding: 3rem 1.8rem; }
  }
</style>

<body>

<div class="card">
  <span class="eyebrow">DeviAcademy · Marina Smit</span>

  <!-- Minimal lotus symbol -->
  <svg class="symbol" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="32" cy="32" r="30" stroke="#c8a090" stroke-width="0.6" opacity="0.4"/>
    <circle cx="32" cy="32" r="4" fill="#c8a090" opacity="0.7"/>
    <path d="M32,28 C30,16 34,16 32,28Z" stroke="#c8a090" stroke-width="0.8" fill="none"/>
    <path d="M32,36 C34,48 30,48 32,36Z" stroke="#c8a090" stroke-width="0.8" fill="none"/>
    <path d="M28,32 C16,30 16,34 28,32Z" stroke="#c8a090" stroke-width="0.8" fill="none"/>
    <path d="M36,32 C48,34 48,30 36,32Z" stroke="#c8a090" stroke-width="0.8" fill="none"/>
    <path d="M29,29 C21,21 24,18 29,29Z" stroke="#c8a090" stroke-width="0.7" fill="none"/>
    <path d="M35,29 C43,21 40,18 35,29Z" stroke="#c8a090" stroke-width="0.7" fill="none"/>
    <path d="M29,35 C21,43 24,46 29,35Z" stroke="#c8a090" stroke-width="0.7" fill="none"/>
    <path d="M35,35 C43,43 40,46 35,35Z" stroke="#c8a090" stroke-width="0.7" fill="none"/>
  </svg>

  <h1>Спасибо,<br><em>что написали</em></h1>
  <p class="subtitle">Ваше сообщение получено</p>
  <hr class="rule">
  <p class="message">
    Мы рады, что вы обратились. Марина свяжется с вами в ближайшее время — внимательно и с заботой.
  </p>

  <div class="countdown-wrap">
    <div class="progress-ring">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle class="track" cx="36" cy="36" r="30"/>
        <circle class="fill" id="ring" cx="36" cy="36" r="30"/>
      </svg>
      <div class="num-inside" id="countNum">10</div>
    </div>
    <span class="countdown-label">Возврат на главную</span>
  </div>

  <a href="index.html" class="btn">Вернуться сейчас</a>

  <p class="footer-note">© 2024–2026 Marina Smit · DeviAcademy</p>
</div>

<script>
  const total = 10;
  let remaining = total;
  const circumference = 2 * Math.PI * 30; // 188.5
  const ring = document.getElementById('ring');
  const num = document.getElementById('countNum');
  ring.style.strokeDashoffset = 0;

  const timer = setInterval(() => {
    remaining--;
    num.textContent = remaining;
    const progress = (total - remaining) / total;
    ring.style.strokeDashoffset = circumference * progress;
    if (remaining <= 0) {
      clearInterval(timer);
      window.location.href = 'index.html';
    }
  }, 1000);
</script>
</body>
</html>
